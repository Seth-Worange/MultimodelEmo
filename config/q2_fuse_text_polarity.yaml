# 数据诊断：融合表征判中性，文本表征判非中性极性。
train:
  data_root: data
  device: cuda
  epochs: 30
  batch_size: 32
  lr: 0.001
  dropout: 0.2
  patience: 5
  seed: 2026
  distill_weight: 0.1
  output_dir: outputs/runs/q2_fuse_text_polarity_s2026
  corruption_probability: 0.8
  corruption_mode: auto
  whole_probability: 0.3
  overlap_probability: 0.5
  interval_ratios: [0.1, 0.2, 0.4, 0.6]
  interval_modalities: [audio, vision]
  local_rate_min: 0.05
  local_rate_max: 0.45
  architecture: fuse
  text_mode: bert
  audio_dynamics: true
  regression_mode: soft
  class_weight_power: 0.5
  encoder_type: bigru
  transformer_layers: 1
  transformer_heads: 4
  tau: 0.1
  kl_beta: 0.01
  contrast_weight: 0.1
  info_weight: 0.1
  dual_weight: 0.05
  mrc_weight: 0.1
  cross_weight: 0.1
  normalize_inputs: true
  evaluation_protocol: sample_v2
  evaluation_seed: 2026
  auxiliary_scale: 0.1
  hierarchical_head: true
  text_polarity_head: true

evaluate:
  checkpoint:
    - outputs/runs/q2_fuse_text_polarity_s2026/best.pt
  split: valid
  data_root: data
  device: cuda
  batch_size: 64
  seed: 2026
  evaluation_protocol: sample_v2
  output: outputs/runs/q2_fuse_text_polarity_s2026/validation_metrics.json
