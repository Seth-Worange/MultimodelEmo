# 问题三对照：从问题二单模型初始化，仅用附件2完整输入适配。
train:
  data_root: data
  device: cuda
  source_checkpoint: outputs/runs/q2_fuse_lowaux_s2026/best.pt
  architecture: fuse
  text_mode: bert
  audio_dynamics: true
  regression_mode: soft
  encoder_type: bigru
  normalize_inputs: true
  dropout: 0.2
  tau: 0.1
  epochs: 12
  patience: 3
  batch_size: 32
  lr: 0.00005
  seed: 2026
  corruption_probability: 0.0
  clean_supervision_weight: 1.0
  auxiliary_scale: 0.0
  selection_scope: clean
  evaluation_protocol: sample_v2
  evaluation_seed: 2026
  output_dir: outputs/q3_fuse_adapt_s2026

evaluate:
  checkpoint: [outputs/q3_fuse_adapt_s2026/best.pt]
  split: valid
  data_root: data
  device: cuda
  batch_size: 64
  seed: 2026
  evaluation_protocol: sample_v2
  neutral_zero: true
  output: outputs/diagnostics/q3_fuse_adapt_s2026/validation.json

infer:
  part: q3
  checkpoint: [outputs/q3_fuse_adapt_s2026/best.pt]
  neutral_zero: true
  device: cuda
  data_root: data
  output_dir: outputs/predictions_q3_fuse_adapt_s2026
  alignment_file: outputs/runs/main/q3_alignment.json
  max_samples: 0
