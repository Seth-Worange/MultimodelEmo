# 从低辅助损失FUSE检查点起步，微调BERT顶两层。
train:
  data_root: data
  device: cuda
  epochs: 12
  batch_size: 32
  patience: 4
  seed: 2026
  output_dir: outputs/runs/q2_fuse_bert_warmstart_s2026
  init_checkpoint: outputs/runs/q2_fuse_lowaux_s2026/best.pt
  architecture: fuse
  text_mode: bert
  bert_finetune: true
  bert_input_source: text_bert
  bert_model_name: google-bert/bert-base-uncased
  bert_model_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  bert_freeze_bottom_layers: 10
  bert_gradient_checkpointing: true
  bert_max_length: 512
  bert_warmup_epochs: 0
  bert_update: true
  bert_learning_rate: 5.0e-6
  lr: 3.0e-5
  amp: true
  dropout: 0.2
  audio_dynamics: true
  regression_mode: soft
  class_weight_power: 0.5
  encoder_type: bigru
  transformer_layers: 1
  transformer_heads: 4
  normalize_inputs: true
  corruption_probability: 0.8
  corruption_mode: auto
  whole_probability: 0.3
  overlap_probability: 0.5
  interval_ratios: [0.1, 0.2, 0.4, 0.6]
  interval_modalities: [audio, vision]
  local_rate_min: 0.05
  local_rate_max: 0.45
  tau: 0.1
  kl_beta: 0.01
  contrast_weight: 0.1
  info_weight: 0.1
  dual_weight: 0.05
  mrc_weight: 0.1
  cross_weight: 0.1
  auxiliary_scale: 0.1
  evaluation_protocol: sample_v2
  evaluation_seed: 2026
evaluate:
  checkpoint: [outputs/runs/q2_fuse_bert_warmstart_s2026/best.pt]
  split: valid
  data_root: data
  device: cuda
  batch_size: 32
  seed: 2026
  evaluation_protocol: sample_v2
  output: outputs/runs/q2_fuse_bert_warmstart_s2026/validation_metrics.json
