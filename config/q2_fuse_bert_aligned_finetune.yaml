# 配对对照：两份配置仅改变BERT是否更新及输出目录。
evaluate:
  batch_size: 32
  checkpoint:
  - outputs/runs/q2_fuse_bert_aligned_finetune_s2026/best.pt
  data_root: data
  device: cuda
  evaluation_protocol: sample_v2
  output: outputs/runs/q2_fuse_bert_aligned_finetune_s2026/validation_metrics.json
  seed: 2026
  split: valid
train:
  amp: true
  architecture: fuse
  audio_dynamics: true
  batch_size: 32
  bert_finetune: true
  bert_freeze_bottom_layers: 10
  bert_gradient_checkpointing: true
  bert_learning_rate: 1.0e-05
  bert_max_length: 512
  bert_model_name: google-bert/bert-base-uncased
  bert_model_revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  class_weight_power: 0.5
  contrast_weight: 0.1
  corruption_mode: auto
  corruption_probability: 0.8
  cross_weight: 0.1
  data_root: data
  device: cuda
  dropout: 0.2
  dual_weight: 0.05
  encoder_type: bigru
  epochs: 30
  evaluation_protocol: sample_v2
  evaluation_seed: 2026
  gradient_accumulation_steps: 1
  info_weight: 0.1
  interval_modalities:
  - audio
  - vision
  interval_ratios:
  - 0.1
  - 0.2
  - 0.4
  - 0.6
  kl_beta: 0.01
  local_rate_max: 0.45
  local_rate_min: 0.05
  lr: 0.001
  mrc_weight: 0.1
  normalize_inputs: true
  output_dir: outputs/runs/q2_fuse_bert_aligned_finetune_s2026
  overlap_probability: 0.5
  patience: 5
  regression_mode: soft
  seed: 2026
  tau: 0.1
  text_mode: bert
  transformer_heads: 4
  transformer_layers: 1
  whole_probability: 0.3
  bert_input_source: text_bert
  bert_warmup_epochs: 2
  bert_update: true
